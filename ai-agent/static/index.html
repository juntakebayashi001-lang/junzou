<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIエージェント チャット</title>
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --accent: #b45f3c;
    --accent-soft: #f3e3da;
    --text: #2b2620;
    --muted: #8a8175;
    --border: #e4dfd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  #reset-btn {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    color: var(--muted);
  }
  #reset-btn:hover { background: var(--accent-soft); color: var(--accent); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error { align-self: center; background: #fdeaea; color: #a33; font-size: 13px; }
  .tool-badge {
    align-self: flex-start;
    font-size: 12px;
    color: var(--muted);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 4px 12px;
  }
  .tool-badge code { color: var(--accent); font-family: monospace; }
  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  form .inner { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  #input {
    flex: 1;
    padding: 12px 14px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    font-family: inherit;
  }
  #input:focus { border-color: var(--accent); }
  #send-btn {
    padding: 0 22px;
    font-size: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; line-height: 2; }
</style>
</head>
<body>
<header>
  <h1>AIエージェント <span>チャット</span></h1>
  <button id="reset-btn">会話をリセット</button>
</header>

<div id="chat">
  <div class="hint">
    こんにちは!ツールが使えるAIエージェントです。試してみてください:<br>
    「今何時?」「1980円の3割引はいくら?」「明日ゴミ出しってメモして」
  </div>
</div>

<form id="form">
  <div class="inner">
    <input id="input" type="text" placeholder="メッセージを入力..." autocomplete="off" autofocus>
    <button id="send-btn" type="submit">送信</button>
  </div>
</form>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
let sessionId = null;

function addEl(className, text) {
  const el = document.createElement("div");
  el.className = className;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  document.querySelector(".hint")?.remove();
  addEl("msg user", message);
  input.value = "";
  sendBtn.disabled = true;

  let assistantEl = null;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // SSE をfetchストリーミングで読み取る(POSTなのでEventSourceは使えない)
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split("\n\n");
      buffer = lines.pop(); // 未完の行は次回に持ち越し

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));

        switch (event.type) {
          case "session":
            sessionId = event.session_id;
            break;
          case "text":
            if (!assistantEl) assistantEl = addEl("msg assistant", "");
            assistantEl.textContent += event.text;
            chat.scrollTop = chat.scrollHeight;
            break;
          case "tool_use":
            assistantEl = null; // ツール後のテキストは新しい吹き出しに
            addEl("tool-badge", `🔧 ツール実行中: ${event.name}`);
            break;
          case "tool_result":
            addEl("tool-badge", `✅ ${event.name}: ${event.result.split("\n")[0]}`);
            break;
          case "error":
            addEl("msg error", `エラー: ${event.message}`);
            break;
        }
      }
    }
  } catch (err) {
    addEl("msg error", `通信エラー: ${err.message}`);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});

document.getElementById("reset-btn").addEventListener("click", async () => {
  if (sessionId) {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId }),
    });
  }
  sessionId = null;
  chat.innerHTML = '<div class="hint">会話をリセットしました。</div>';
});
</script>
</body>
</html>
